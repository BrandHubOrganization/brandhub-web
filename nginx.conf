server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for Core Web Vitals & fast crawler indexing
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/rss+xml
        application/manifest+json
        image/svg+xml;

    # Security & crawler-friendly headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Canonical URL normalization: strip trailing slash (except root /) to prevent duplicate URLs
    rewrite ^/(.+)/$ /$1 permanent;

    # Immutable long-term cache for Vite content-hashed assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Explicit XML / TXT Content-Type & fresh revalidation for SEO/GEO feeds
    location ~* ^/(sitemap\.xml|rss\.xml|robots\.txt|llms\.txt|llms-full\.txt)$ {
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Pre-rendered routes (/blog/<slug> -> /blog/<slug>/index.html) + SPA fallback
    location / {
        try_files $uri $uri/index.html /index.html;
    }

    location /api {
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
